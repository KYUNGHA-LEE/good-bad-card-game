<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>좋은말 나쁜말 카드 게임</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #F6FBFD;
      --ink: #4A4F5E;
      --ink-soft: #7A8496;

      --blue-soft: #CAEAFF;
      --blue-mid: #A7DEF0;
      --blue-deep: #5B9FD1;
      --blue-text: #37698C;

      --pink-soft: #FFDED7;
      --pink-mid: #FFC9BE;
      --pink-deep: #E4796C;
      --pink-text: #A34E42;

      --green-soft: #E4F3DC;
      --green-mid: #C4E4AF;
      --green-deep: #7FB069;
      --green-text: #4B7A3A;

      --yellow-soft: #FDF3D2;
      --yellow-text: #A87B1F;

      --purple-soft: #EBE5F8;
      --purple-mid: #D6CBF0;
      --purple-text: #6B5A9E;

      --line: #E6EFF5;
      --shadow: 0 10px 24px rgba(120, 160, 185, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      font-family: "Gowun Dodum", "Apple SD Gothic Neo", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(560px 360px at 8% -6%, #DFF1FB 0%, rgba(223, 241, 251, 0) 70%),
        radial-gradient(520px 340px at 96% 4%, #FDE9E3 0%, rgba(253, 233, 227, 0) 70%),
        radial-gradient(600px 400px at 50% 108%, #EAF5E2 0%, rgba(234, 245, 226, 0) 70%),
        var(--bg);
      min-height: 100dvh;
    }

    /* 게임 중(학생 화면)에는 화면 높이에 맞춰 카드판이 자동으로 채워집니다. */
    body.playing {
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
    }

    h1, h2, h3 {
      font-family: "Jua", "Gowun Dodum", sans-serif;
      font-weight: 400;
      letter-spacing: 0.5px;
    }

    header {
      position: relative;
      background: linear-gradient(135deg, #CAEAFF 0%, #E3E9FB 45%, #FFE3DC 100%);
      color: var(--blue-text);
      padding: 34px 22px 46px;
      text-align: center;
      border-radius: 0 0 40px 40px;
      overflow: hidden;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    header p {
      margin: 0;
      font-size: 16px;
      color: #5C6B80;
    }

    header .deco {
      position: absolute;
      font-size: 26px;
      opacity: 0.75;
      pointer-events: none;
    }

    header .deco.d1 { top: 18px; left: 22px; }
    header .deco.d2 { top: 54px; right: 30px; }
    header .deco.d3 { bottom: 16px; left: 14%; font-size: 20px; }
    header .deco.d4 { bottom: 22px; right: 16%; font-size: 20px; }

    .made-by {
      position: absolute;
      top: 12px;
      right: 16px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--blue-text);
      font-size: 13px;
      padding: 5px 12px;
      border-radius: 999px;
      z-index: 2;
    }

    main {
      width: 100%;
      max-width: 1160px;
      margin: 0 auto;
      padding: 26px 20px 60px;
    }

    /* 게임 중에는 main / 게임 패널이 남은 높이를 모두 차지합니다. */
    body.playing main {
      flex: 1;
      min-height: 0;
      display: flex;
      padding: 12px 14px 14px;
    }

    body.playing #gamePanel {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      margin: 0;
      padding: 14px;
    }

    body.playing header {
      padding: 14px 18px 16px;
      border-radius: 0 0 22px 22px;
    }

    body.playing header h1 { font-size: 21px; margin: 0; }
    body.playing header p { display: none; }
    body.playing header .deco { display: none; }
    body.playing .made-by { top: 8px; right: 10px; font-size: 12px; padding: 4px 10px; }
    body.playing #gamePanel > h2,
    body.playing #gamePanel > .wave { display: none; }

    .panel {
      background: rgba(255, 255, 255, 0.92);
      border: 2px solid var(--line);
      border-radius: 26px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow: var(--shadow);
    }

    .panel h2 {
      margin: 0 0 6px;
      font-size: 24px;
      color: var(--blue-text);
    }

    .panel h2 + .sub {
      margin: 0 0 18px;
      color: var(--ink-soft);
      font-size: 14px;
    }

    .panel h3 {
      color: var(--purple-text);
      font-size: 20px;
      margin: 26px 0 6px;
    }

    .wave {
      height: 10px;
      margin: 0 0 16px;
      border-radius: 999px;
      background: repeating-linear-gradient(90deg, var(--blue-mid) 0 14px, transparent 14px 28px);
      opacity: 0.55;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }

    label.field {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #F4FAFD;
      border: 2px solid var(--line);
      border-radius: 16px;
      padding: 8px 14px;
      font-size: 15px;
      color: var(--blue-text);
    }

    button {
      border: none;
      border-radius: 16px;
      padding: 13px 20px;
      font-family: "Jua", "Gowun Dodum", sans-serif;
      font-size: 16px;
      cursor: pointer;
      background: var(--blue-deep);
      color: white;
      box-shadow: 0 4px 10px rgba(91, 159, 209, 0.28);
      transition: transform 0.12s, box-shadow 0.12s, filter 0.12s;
    }

    button:hover {
      transform: translateY(-2px);
      filter: brightness(1.04);
    }

    button:active {
      transform: translateY(0);
    }

    button.secondary {
      background: #EAF4FA;
      color: var(--blue-text);
      box-shadow: none;
      border: 2px solid var(--blue-soft);
    }

    button.soft {
      background: var(--purple-mid);
      color: var(--purple-text);
      box-shadow: none;
    }

    button.danger {
      background: var(--pink-deep);
      box-shadow: 0 4px 10px rgba(228, 121, 108, 0.28);
    }

    input, select {
      padding: 11px 13px;
      border: 2px solid var(--line);
      border-radius: 14px;
      font-family: "Gowun Dodum", sans-serif;
      font-size: 16px;
      background: white;
      color: var(--ink);
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--blue-mid);
    }

    .hidden {
      display: none !important;
    }

    /* ---------- 학생 화면 상단 가로 바 ---------- */
    .status-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #F4FAFD;
      border: 2px solid var(--line);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 14px;
      color: var(--ink-soft);
      white-space: nowrap;
    }

    .pill b {
      font-family: "Jua", sans-serif;
      font-weight: 400;
      font-size: 18px;
      color: var(--blue-text);
    }

    .pill.nick { background: var(--blue-soft); border-color: var(--blue-soft); }
    .pill.score b { color: var(--blue-deep); font-size: 22px; }
    .pill.timer {
      background: var(--yellow-soft);
      border-color: var(--yellow-soft);
      color: var(--yellow-text);
      font-family: "Jua", sans-serif;
      font-size: 19px;
    }
    .pill.chip { background: var(--purple-soft); border-color: var(--purple-soft); color: var(--purple-text); }

    .chips-inline { display: contents; }

    .play-msg {
      margin: 10px 0 0;
      font-size: 14px;
      color: var(--blue-text);
      line-height: 1.4;
    }

    /* 남은 공간 전체를 카드판이 채웁니다. */
    .board-area {
      flex: 1;
      min-height: 0;
      display: flex;
      margin-top: 10px;
    }

    /* ---------- 좋은말 고르기 카드 ---------- */
    .card-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-auto-rows: 1fr;
      gap: 10px;
    }

    .word-card {
      border-radius: 22px;
      background: white;
      border: 3px solid var(--blue-soft);
      font-family: "Jua", "Gowun Dodum", sans-serif;
      font-size: clamp(12px, calc(0.9vw + 1.5vh), 22px);
      line-height: 1.2;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s, border-color 0.15s;
      padding: 10px;
      user-select: none;
      color: var(--ink);
      box-shadow: 0 5px 12px rgba(140, 175, 200, 0.14);
      word-break: keep-all;
    }

    .word-card:hover {
      transform: translateY(-3px) scale(1.03);
      background: #F6FBFF;
    }

    .word-card.correct {
      background: var(--green-soft);
      border-color: var(--green-mid);
      color: var(--green-text);
    }

    .word-card.wrong {
      background: #FDE6E1;
      border-color: var(--pink-mid);
      color: var(--pink-text);
    }

    /* ---------- 기억력 카드 ---------- */
    .memory-grid {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-auto-rows: 1fr;
      gap: 10px;
    }

    .mem-card {
      position: relative;
      perspective: 700px;
      cursor: pointer;
      user-select: none;
    }

    .mem-inner {
      position: absolute;
      inset: 0;
      transition: transform 0.35s;
      transform-style: preserve-3d;
    }

    .mem-card.flipped .mem-inner,
    .mem-card.matched .mem-inner {
      transform: rotateY(180deg);
    }

    .mem-face {
      position: absolute;
      inset: 0;
      backface-visibility: hidden;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 8px;
      font-family: "Jua", "Gowun Dodum", sans-serif;
      box-shadow: 0 5px 12px rgba(140, 175, 200, 0.16);
      word-break: keep-all;
    }

    .mem-back {
      background: linear-gradient(135deg, #CDE9F6 0%, #E6DFF6 100%);
      border: 3px solid white;
      font-size: clamp(18px, calc(1vw + 2.2vh), 34px);
    }

    .mem-front {
      background: white;
      border: 3px solid var(--purple-mid);
      color: var(--purple-text);
      font-size: clamp(11px, calc(0.8vw + 1.4vh), 20px);
      transform: rotateY(180deg);
      line-height: 1.25;
    }

    .mem-card.matched .mem-front {
      background: var(--green-soft);
      border-color: var(--green-mid);
      color: var(--green-text);
    }

    .mem-card.matched {
      cursor: default;
    }

    /* ---------- 점수판 ---------- */
    .scoreboard {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 8px;
      margin-top: 10px;
    }

    .scoreboard th {
      text-align: left;
      padding: 6px 14px;
      font-family: "Jua", sans-serif;
      color: var(--ink-soft);
      font-size: 15px;
      font-weight: 400;
    }

    .scoreboard td {
      background: #F7FBFD;
      padding: 13px 14px;
      font-size: 16px;
    }

    .scoreboard td:first-child {
      border-radius: 14px 0 0 14px;
      width: 70px;
      font-family: "Jua", sans-serif;
      color: var(--ink-soft);
    }

    .scoreboard td:last-child {
      border-radius: 0 14px 14px 0;
      font-family: "Jua", sans-serif;
      color: var(--blue-deep);
      font-size: 19px;
    }

    .scoreboard tr.top td {
      background: var(--yellow-soft);
    }

    .badge {
      display: inline-block;
      background: var(--blue-soft);
      color: var(--blue-text);
      padding: 8px 16px;
      border-radius: 999px;
      font-family: "Jua", sans-serif;
      letter-spacing: 2px;
    }

    .timer-badge {
      display: inline-block;
      background: var(--yellow-soft);
      color: var(--yellow-text);
      padding: 7px 16px;
      border-radius: 999px;
      font-family: "Jua", sans-serif;
      font-size: 21px;
    }

    .big-score {
      font-family: "Jua", sans-serif;
      font-size: 38px;
      color: var(--blue-deep);
    }

    .stat-line {
      margin: 8px 0;
      font-size: 16px;
    }

    .message {
      margin-top: 14px;
      background: #F7FBFD;
      border: 2px dashed var(--blue-soft);
      border-radius: 16px;
      padding: 12px 14px;
      color: var(--blue-text);
      word-break: break-word;
    }

    .message.error {
      background: #FDF0ED;
      border-color: var(--pink-mid);
      color: var(--pink-text);
    }

    .message:empty {
      display: none;
    }

    .hint {
      color: var(--ink-soft);
      font-size: 14px;
      line-height: 1.7;
      margin-top: 14px;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .chip {
      background: var(--purple-soft);
      color: var(--purple-text);
      border-radius: 999px;
      padding: 6px 14px;
      font-size: 14px;
    }

    @media (max-width: 800px) {
      header { padding: 26px 18px 30px; border-radius: 0 0 28px 28px; }
      header h1 { font-size: 24px; }
      header .deco { display: none; }
      main { padding: 16px 12px 40px; }
      .panel { padding: 16px; border-radius: 22px; }
      .made-by { font-size: 12px; padding: 4px 10px; top: 10px; right: 10px; }

      /* 세로 화면에서는 3열 — 카드 글씨가 뭉개지지 않는 최소 폭 확보 */
      .card-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
      }

      .word-card {
        border-radius: 16px;
        padding: 4px;
        border-width: 2px;
        font-size: clamp(11px, calc(1.2vw + 1.1vh), 17px);
      }

      .memory-grid { gap: 7px; }
      .mem-face { border-radius: 15px; border-width: 2px; }

      /* 상단 바는 한 줄로 — 판 번호는 좁은 화면에서 생략해 카드 공간을 확보합니다. */
      .status-bar { gap: 6px; }
      #memoryBoardChip { display: none; }
      .pill { padding: 5px 11px; font-size: 12px; border-width: 1px; }
      .pill b { font-size: 16px; }
      .pill.score b { font-size: 19px; }
      .pill.timer { font-size: 17px; }
      .play-msg { margin-top: 8px; font-size: 12.5px; }

      body.playing main { padding: 8px 8px 10px; }
      body.playing #gamePanel { padding: 10px; border-radius: 18px; }
      body.playing header { padding: 10px 14px 12px; border-radius: 0 0 16px 16px; }
      body.playing header h1 { font-size: 18px; }
      body.playing .board-area { margin-top: 8px; }

      /* 강사 화면: 선택 항목과 버튼이 화면 폭에 맞게 늘어납니다. */
      label.field {
        width: 100%;
        justify-content: space-between;
      }

      label.field select {
        flex: 1;
        min-width: 0;
        margin-left: 10px;
      }

      #teacherPanel .row button { flex: 1 1 45%; }
      #startPanel .row button,
      #studentJoinPanel .row > input,
      #studentJoinPanel .row > button { flex: 1 1 100%; }
    }

    /* 폰을 가로로 눕힌 화면(높이가 낮은 화면)에서는 위쪽을 최대한 줄입니다. */
    @media (max-height: 540px) {
      .card-grid { grid-template-columns: repeat(5, 1fr); }

      body.playing header { padding: 6px 12px 7px; border-radius: 0 0 14px 14px; }
      body.playing header h1 { font-size: 15px; }
      body.playing main { padding: 6px 8px 8px; }
      body.playing #gamePanel { padding: 8px; border-radius: 14px; }
      body.playing .board-area { margin-top: 6px; }
      body.playing .play-msg { display: none; }
      body.playing .made-by { display: none; }

      .status-bar { gap: 6px; }
      #memoryBoardChip { display: none; }
      .pill { padding: 3px 10px; font-size: 12px; border-width: 1px; }
      .pill b { font-size: 15px; }
      .pill.score b { font-size: 17px; }
      .pill.timer { font-size: 16px; }

      .card-grid, .memory-grid { gap: 6px; }
      .word-card { border-radius: 12px; border-width: 2px; padding: 3px; font-size: clamp(11px, calc(0.9vw + 1.6vh), 17px); }
      .mem-face { border-radius: 12px; border-width: 2px; }
    }

    /* 터치 기기에서는 커서를 올렸을 때의 확대 효과를 끕니다. */
    @media (hover: none) {
      .word-card:hover { transform: none; background: white; }
      button:hover { transform: none; }
    }
  </style>
</head>

<body>
  <header>
    <span class="made-by">Made by 이경하</span>

    <span class="deco d1">🌸</span>
    <span class="deco d2">✨</span>
    <span class="deco d3">💧</span>
    <span class="deco d4">🍀</span>

    <h1>좋은말 나쁜말 카드 게임</h1>
    <p>좋은말 고르기 · 기억력 카드 짝맞추기</p>
  </header>

  <main>
    <section id="startPanel" class="panel">
      <h2>입장하기</h2>
      <p class="sub">방 코드와 닉네임만 있으면 바로 시작할 수 있어요.</p>
      <div class="wave"></div>

      <div class="row">
        <button id="teacherLoginBtn">강사로 입장</button>
        <button id="studentModeBtn" class="secondary">학생으로 입장</button>
      </div>

      <p class="message error" id="startMessage"></p>
      <p class="hint" id="startHint">강사로 입장을 누르면 강사 화면으로 들어갑니다.</p>
    </section>

    <section id="studentJoinPanel" class="panel hidden">
      <h2>학생 입장</h2>
      <p class="sub">칠판에 적힌 방 코드를 입력해 주세요.</p>
      <div class="wave"></div>

      <div class="row">
        <input id="roomCodeInput" placeholder="방 코드 입력" />
        <input id="nicknameInput" placeholder="닉네임 입력" />
        <button id="studentJoinBtn">입장</button>
      </div>

      <p class="message error" id="studentJoinMessage"></p>
    </section>

    <section id="teacherPanel" class="panel hidden">
      <h2>강사 화면</h2>
      <p class="sub">게임 종류를 고르고 시작을 누르면 학생 화면이 바뀝니다.</p>
      <div class="wave"></div>

      <p class="stat-line">방 코드: <span id="teacherRoomCode" class="badge"></span></p>
      <p class="stat-line">남은 시간: <span id="teacherGameTimer" class="timer-badge">대기</span></p>

      <div class="row" style="margin-top:14px">
        <label class="field">
          게임 종류
          <select id="gameTypeSelect">
            <option value="goodbad" selected>좋은말 고르기</option>
            <option value="memory">기억력 카드 짝맞추기</option>
          </select>
        </label>

        <label class="field" id="goodBadOptions">
          카드 변경 속도
          <select id="cardSpeedSelect">
            <option value="3">3초</option>
            <option value="5" selected>5초</option>
            <option value="10">10초</option>
          </select>
        </label>

        <label class="field hidden" id="memorySizeOption">
          판 크기
          <select id="memorySizeSelect">
            <option value="8" selected>4×4 (8쌍)</option>
            <option value="12">4×6 (12쌍)</option>
          </select>
        </label>

        <label class="field hidden" id="memoryTimeOption">
          게임 시간
          <select id="memoryTimeSelect">
            <option value="60">60초</option>
            <option value="90" selected>90초</option>
            <option value="120">120초</option>
          </select>
        </label>
      </div>

      <div class="row" style="margin-top:14px">
        <button id="createRoomBtn" class="soft">새 방 만들기</button>
        <button id="startGameBtn">게임 시작</button>
        <button id="refreshCardsBtn" class="secondary">카드 바꾸기</button>
        <button id="resetGameBtn" class="danger">게임 초기화</button>
      </div>

      <p class="hint" id="teacherHint"></p>

      <h3>점수판</h3>
      <table class="scoreboard">
        <thead>
          <tr>
            <th>순위</th>
            <th>닉네임</th>
            <th>점수</th>
          </tr>
        </thead>
        <tbody id="scoreBody"></tbody>
      </table>
    </section>

    <section id="gamePanel" class="panel hidden">
      <h2>학생 게임 화면</h2>
      <div class="wave"></div>

      <div class="status-bar">
        <span class="pill nick"><b id="myNickname"></b></span>
        <span class="pill score">점수 <b id="myScore">0</b></span>
        <span class="pill timer" id="studentGameTimer">대기</span>

        <span class="chips-inline hidden" id="memoryChips">
          <span class="pill chip" id="memoryPairChip">맞춘 짝 0</span>
          <span class="pill chip" id="memoryBoardChip">1번째 판</span>
        </span>
      </div>

      <p id="gameStatusMessage" class="play-msg">강사가 게임을 시작하면 카드가 보입니다.</p>

      <div class="board-area">
        <div id="cardGrid" class="card-grid"></div>
        <div id="memoryGrid" class="memory-grid hidden"></div>
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-app.js";

    import {
      getAuth,
      signInAnonymously,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-auth.js";

    import {
      getDatabase,
      ref,
      set,
      update,
      get,
      onValue,
      remove
    } from "https://www.gstatic.com/firebasejs/10.12.4/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCxYybI64MBWeEGolyv_IKjkug2bVoZghQ",
      authDomain: "good-bad-card-game.firebaseapp.com",
      databaseURL: "https://good-bad-card-game-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "good-bad-card-game",
      storageBucket: "good-bad-card-game.firebasestorage.app",
      messagingSenderId: "553884713592",
      appId: "1:553884713592:web:8818f29cff2f65ad1de38d"
    };

    const GOODBAD_DURATION_SECONDS = 60;
    const MEMORY_BONUS_POINT = 3;

    // 강사 입장은 주소 뒤에 ?mode=admin 을 붙였을 때만 노출 (전 게임 공통 규칙)
    const isAdminMode = new URLSearchParams(location.search).get("mode") === "admin";

    if (!isAdminMode) {
      document.getElementById("teacherLoginBtn").classList.add("hidden");
      document.getElementById("startHint").textContent =
        "학생으로 입장을 눌러 방 코드와 닉네임을 입력하세요.";
    }

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const goodWords = [
      "고마워",
      "괜찮아",
      "미안해",
      "잘했어",
      "할 수 있어",
      "함께하자",
      "도와줄게",
      "기다릴게",
      "응원해",
      "좋은 생각이야",
      "천천히 해도 돼",
      "네 마음 이해해",
      "다시 해보자",
      "소중해",
      "멋진 생각이야",
      "네 편이야",
      "괜찮아질 거야",
      "용기 내",
      "같이 해보자",
      "잘 듣고 있어",
      "충분히 잘하고 있어",
      "포기하지 말자",
      "고생했어",
      "믿고 있어",
      "도움이 필요하면 말해줘"
    ];

    const badWords = [
      "안 고마워",
      "안 괜찮아",
      "별로야",
      "못 할 거야",
      "혼자 해",
      "빨리 해",
      "틀렸잖아",
      "왜 그래",
      "그만해",
      "네 탓이야",
      "싫어",
      "귀찮아",
      "말 걸지 마",
      "필요 없어",
      "너 때문이야",
      "이상해",
      "못하네",
      "가만히 있어",
      "상관없어",
      "시끄러워",
      "내가 알 바 아니야",
      "너나 해",
      "답답해",
      "안 도와줄래",
      "그게 뭐야"
    ];

    // 기억력 게임은 카드가 작아서 짧은 좋은말만 사용합니다.
    const memoryWords = goodWords.filter((word) => word.length <= 7);

    let currentUser = null;
    let currentRoomCode = null;
    let currentPlayerId = null;
    let currentNickname = "";
    let isTeacher = false;

    let cardChangeInterval = null;
    let teacherGameTimerInterval = null;
    let studentGameTimerInterval = null;
    let gameEndAt = null;

    // 학생 화면 렌더링 상태
    let renderedCardsKey = "";
    let renderedMemoryKey = "";

    const memoryState = {
      deck: [],
      firstIndex: -1,
      busy: false,
      matchedCount: 0,
      boardNumber: 1,
      localRound: 0
    };

    const startPanel = document.getElementById("startPanel");
    const studentJoinPanel = document.getElementById("studentJoinPanel");
    const teacherPanel = document.getElementById("teacherPanel");
    const gamePanel = document.getElementById("gamePanel");

    const teacherLoginBtn = document.getElementById("teacherLoginBtn");
    const studentModeBtn = document.getElementById("studentModeBtn");
    const studentJoinBtn = document.getElementById("studentJoinBtn");

    const createRoomBtn = document.getElementById("createRoomBtn");
    const startGameBtn = document.getElementById("startGameBtn");
    const refreshCardsBtn = document.getElementById("refreshCardsBtn");
    const resetGameBtn = document.getElementById("resetGameBtn");

    const gameTypeSelect = document.getElementById("gameTypeSelect");
    const cardSpeedSelect = document.getElementById("cardSpeedSelect");
    const memorySizeSelect = document.getElementById("memorySizeSelect");
    const memoryTimeSelect = document.getElementById("memoryTimeSelect");

    const goodBadOptions = document.getElementById("goodBadOptions");
    const memorySizeOption = document.getElementById("memorySizeOption");
    const memoryTimeOption = document.getElementById("memoryTimeOption");
    const teacherHint = document.getElementById("teacherHint");

    const teacherRoomCode = document.getElementById("teacherRoomCode");
    const teacherGameTimer = document.getElementById("teacherGameTimer");
    const scoreBody = document.getElementById("scoreBody");

    const roomCodeInput = document.getElementById("roomCodeInput");
    const nicknameInput = document.getElementById("nicknameInput");
    const studentJoinMessage = document.getElementById("studentJoinMessage");

    const myNickname = document.getElementById("myNickname");
    const myScore = document.getElementById("myScore");
    const studentGameTimer = document.getElementById("studentGameTimer");
    const gameStatusMessage = document.getElementById("gameStatusMessage");
    const cardGrid = document.getElementById("cardGrid");
    const memoryGrid = document.getElementById("memoryGrid");
    const memoryChips = document.getElementById("memoryChips");
    const memoryPairChip = document.getElementById("memoryPairChip");
    const memoryBoardChip = document.getElementById("memoryBoardChip");
    const startMessage = document.getElementById("startMessage");

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
    });

    /* ===================== 입장 ===================== */

    teacherLoginBtn.addEventListener("click", async () => {
      startMessage.textContent = "";

      try {
        const result = await signInAnonymously(auth);

        currentUser = result.user;
        isTeacher = true;

        startPanel.classList.add("hidden");
        teacherPanel.classList.remove("hidden");

        applyTeacherOptionView();
        await createRoom();
      } catch (error) {
        startMessage.textContent =
          "강사 입장 오류: " + error.code + " / " + error.message;

        console.error("Teacher login error:", error);
      }
    });

    studentModeBtn.addEventListener("click", () => {
      startMessage.textContent = "";
      startPanel.classList.add("hidden");
      studentJoinPanel.classList.remove("hidden");
    });

    studentJoinBtn.addEventListener("click", async () => {
      studentJoinMessage.textContent = "";

      const roomCode = roomCodeInput.value.trim().toUpperCase();
      const nickname = nicknameInput.value.trim();

      if (!roomCode || !nickname) {
        studentJoinMessage.textContent = "방 코드와 닉네임을 모두 입력하세요.";
        return;
      }

      try {
        const result = await signInAnonymously(auth);

        currentUser = result.user;
        currentRoomCode = roomCode;
        currentPlayerId = currentUser.uid;
        currentNickname = nickname;

        const roomSnapshot = await get(ref(db, `rooms/${roomCode}`));

        if (!roomSnapshot.exists()) {
          studentJoinMessage.textContent = "존재하지 않는 방 코드입니다.";
          return;
        }

        await set(ref(db, `rooms/${roomCode}/players/${currentPlayerId}`), {
          nickname: nickname,
          score: 0
        });

        myNickname.textContent = nickname;

        studentJoinPanel.classList.add("hidden");
        gamePanel.classList.remove("hidden");

        // 학생 화면은 카드판이 화면 높이에 맞춰지도록 전용 레이아웃을 씁니다.
        document.body.classList.add("playing");

        listenRoomForStudent(roomCode);
      } catch (error) {
        studentJoinMessage.textContent =
          "학생 입장 오류: " + error.code + " / " + error.message;

        console.error("Student join error:", error);
      }
    });

    /* ===================== 강사 조작 ===================== */

    gameTypeSelect.addEventListener("change", applyTeacherOptionView);

    function applyTeacherOptionView() {
      const isMemory = gameTypeSelect.value === "memory";

      goodBadOptions.classList.toggle("hidden", isMemory);
      refreshCardsBtn.classList.toggle("hidden", isMemory);
      memorySizeOption.classList.toggle("hidden", !isMemory);
      memoryTimeOption.classList.toggle("hidden", !isMemory);

      teacherHint.textContent = isMemory
        ? "학생들은 같은 카드 배치를 받아 각자 짝을 맞춥니다. 짝 하나당 +1점, 한 판을 다 맞추면 보너스 +" +
          MEMORY_BONUS_POINT + "점을 받고 새 판이 시작됩니다."
        : "게임 시간은 60초입니다. 카드 변경 속도는 3초, 5초, 10초 중 선택할 수 있습니다.";
    }

    createRoomBtn.addEventListener("click", createRoom);

    startGameBtn.addEventListener("click", async () => {
      if (!currentRoomCode) return;

      stopTeacherIntervals();

      const gameType = gameTypeSelect.value;

      if (gameType === "memory") {
        const pairCount = Number(memorySizeSelect.value);
        const durationSeconds = Number(memoryTimeSelect.value);

        gameEndAt = Date.now() + durationSeconds * 1000;

        await update(ref(db, `rooms/${currentRoomCode}`), {
          status: "playing",
          gameType: "memory",
          cards: makeMemoryDeck(pairCount),
          memoryPairCount: pairCount,
          cardChangeSeconds: null,
          gameDurationSeconds: durationSeconds,
          gameEndAt: gameEndAt,
          updatedAt: Date.now()
        });

        startTeacherGameTimer(gameEndAt);
        return;
      }

      const selectedCardSeconds = Number(cardSpeedSelect.value);
      gameEndAt = Date.now() + GOODBAD_DURATION_SECONDS * 1000;

      await update(ref(db, `rooms/${currentRoomCode}`), {
        status: "playing",
        gameType: "goodbad",
        cards: makeRandomCards(),
        memoryPairCount: null,
        cardChangeSeconds: selectedCardSeconds,
        gameDurationSeconds: GOODBAD_DURATION_SECONDS,
        gameEndAt: gameEndAt,
        updatedAt: Date.now()
      });

      startTeacherGameTimer(gameEndAt);
      startAutoCardChange(selectedCardSeconds);
    });

    refreshCardsBtn.addEventListener("click", async () => {
      if (!currentRoomCode) return;
      if (gameTypeSelect.value === "memory") return;

      await update(ref(db, `rooms/${currentRoomCode}`), {
        cards: makeRandomCards(),
        updatedAt: Date.now()
      });
    });

    resetGameBtn.addEventListener("click", async () => {
      if (!currentRoomCode) return;

      const ok = confirm("정말 게임을 초기화할까요?");
      if (!ok) return;

      stopTeacherIntervals();

      await remove(ref(db, `rooms/${currentRoomCode}`));
      await createRoom();
    });

    async function createRoom() {
      if (!isTeacher) return;

      stopTeacherIntervals();

      currentRoomCode = makeRoomCode();
      teacherRoomCode.textContent = currentRoomCode;
      teacherGameTimer.textContent = "대기";

      await set(ref(db, `rooms/${currentRoomCode}`), {
        status: "waiting",
        gameType: gameTypeSelect.value,
        cards: [],
        createdAt: Date.now()
      });

      listenRoomForTeacher(currentRoomCode);
    }

    function makeRoomCode() {
      const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let code = "";

      for (let i = 0; i < 5; i++) {
        code += letters[Math.floor(Math.random() * letters.length)];
      }

      return code;
    }

    function makeRandomCards() {
      const selectedGood = shuffle(goodWords)
        .slice(0, 13)
        .map((word) => ({
          text: word,
          type: "good"
        }));

      const selectedBad = shuffle(badWords)
        .slice(0, 12)
        .map((word) => ({
          text: word,
          type: "bad"
        }));

      return shuffle([...selectedGood, ...selectedBad]);
    }

    function makeMemoryDeck(pairCount) {
      const words = shuffle(memoryWords).slice(0, pairCount);
      const deck = [];

      words.forEach((word, index) => {
        deck.push({ text: word, pairId: index });
        deck.push({ text: word, pairId: index });
      });

      return shuffle(deck);
    }

    function shuffle(array) {
      const copy = [...array];

      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }

      return copy;
    }

    function startAutoCardChange(cardSeconds) {
      clearInterval(cardChangeInterval);

      cardChangeInterval = setInterval(async () => {
        if (!isTeacher) return;
        if (!currentRoomCode) return;
        if (!auth.currentUser) return;
        if (!gameEndAt) return;

        if (Date.now() >= gameEndAt) {
          await endGame();
          return;
        }

        await update(ref(db, `rooms/${currentRoomCode}`), {
          cards: makeRandomCards(),
          updatedAt: Date.now()
        });
      }, cardSeconds * 1000);
    }

    function startTeacherGameTimer(endAt) {
      clearInterval(teacherGameTimerInterval);

      teacherGameTimer.textContent = getRemainingSeconds(endAt) + "초";

      teacherGameTimerInterval = setInterval(async () => {
        const remaining = getRemainingSeconds(endAt);
        teacherGameTimer.textContent = remaining + "초";

        if (remaining <= 0) {
          await endGame();
        }
      }, 1000);
    }

    function startStudentGameTimer(endAt) {
      clearInterval(studentGameTimerInterval);

      studentGameTimer.textContent = getRemainingSeconds(endAt) + "초";

      studentGameTimerInterval = setInterval(() => {
        const remaining = getRemainingSeconds(endAt);
        studentGameTimer.textContent = remaining + "초";

        if (remaining <= 0) {
          clearInterval(studentGameTimerInterval);
          studentGameTimer.textContent = "종료";
          gameStatusMessage.textContent = "게임이 종료되었습니다.";
          clearStudentBoards();
        }
      }, 1000);
    }

    function getRemainingSeconds(endAt) {
      return Math.max(0, Math.ceil((endAt - Date.now()) / 1000));
    }

    async function endGame() {
      if (!currentRoomCode) return;

      stopTeacherIntervals();

      teacherGameTimer.textContent = "종료";

      await update(ref(db, `rooms/${currentRoomCode}`), {
        status: "ended",
        cards: [],
        endedAt: Date.now()
      });
    }

    function stopTeacherIntervals() {
      clearInterval(cardChangeInterval);
      clearInterval(teacherGameTimerInterval);

      cardChangeInterval = null;
      teacherGameTimerInterval = null;
    }

    /* ===================== 실시간 구독 ===================== */

    function listenRoomForTeacher(roomCode) {
      onValue(ref(db, `rooms/${roomCode}/players`), (snapshot) => {
        const players = snapshot.val() || {};
        const playerList = Object.values(players).sort((a, b) => b.score - a.score);
        const medals = ["🥇", "🥈", "🥉"];

        scoreBody.innerHTML = "";

        playerList.forEach((player, index) => {
          const tr = document.createElement("tr");

          if (index < 3) {
            tr.className = "top";
          }

          tr.innerHTML = `
            <td>${medals[index] || index + 1}</td>
            <td>${escapeHtml(player.nickname)}</td>
            <td>${player.score}</td>
          `;

          scoreBody.appendChild(tr);
        });
      });
    }

    function listenRoomForStudent(roomCode) {
      onValue(ref(db, `rooms/${roomCode}`), (snapshot) => {
        const room = snapshot.val();

        if (!room) {
          gameStatusMessage.textContent = "방이 종료되었습니다.";
          studentGameTimer.textContent = "종료";
          clearStudentBoards();
          return;
        }

        if (room.status === "waiting") {
          gameStatusMessage.textContent = "강사가 게임을 시작하면 카드가 보입니다.";
          studentGameTimer.textContent = "대기";
          clearStudentBoards();
          return;
        }

        if (room.status === "ended") {
          clearInterval(studentGameTimerInterval);
          gameStatusMessage.textContent = "게임이 종료되었습니다.";
          studentGameTimer.textContent = "종료";
          clearStudentBoards();
          return;
        }

        if (room.status !== "playing") return;

        if (room.gameEndAt) {
          startStudentGameTimer(room.gameEndAt);
        }

        const cards = Array.isArray(room.cards)
          ? room.cards
          : Object.values(room.cards || {});

        if (room.gameType === "memory") {
          cardGrid.classList.add("hidden");
          memoryGrid.classList.remove("hidden");
          memoryChips.classList.remove("hidden");

          gameStatusMessage.textContent =
            "같은 낱말 카드 두 장을 찾으세요. 짝 하나당 +1점, 한 판을 다 맞추면 +" +
            MEMORY_BONUS_POINT + "점!";

          const deckKey = "server:" + cards.map((card) => card.text).join("|");

          if (deckKey !== renderedMemoryKey) {
            renderedMemoryKey = deckKey;
            memoryState.boardNumber = 1;
            memoryState.localRound = 0;
            startMemoryBoard(cards);
          }

          return;
        }

        cardGrid.classList.remove("hidden");
        memoryGrid.classList.add("hidden");
        memoryChips.classList.add("hidden");

        gameStatusMessage.textContent =
          "좋은말만 골라서 클릭하세요. 카드 변경 속도: " +
          (room.cardChangeSeconds || "?") + "초";

        const cardsKey = cards.map((card) => card.text).join("|");

        if (cardsKey !== renderedCardsKey) {
          renderedCardsKey = cardsKey;
          renderCards(cards);
        }
      });

      onValue(ref(db, `rooms/${roomCode}/players/${currentPlayerId}/score`), (snapshot) => {
        myScore.textContent = snapshot.val() ?? 0;
      });
    }

    function clearStudentBoards() {
      cardGrid.innerHTML = "";
      memoryGrid.innerHTML = "";
      memoryChips.classList.add("hidden");
      renderedCardsKey = "";
      renderedMemoryKey = "";
    }

    /* ===================== 좋은말 고르기 ===================== */

    function renderCards(cards) {
      cardGrid.innerHTML = "";

      cards.forEach((card) => {
        const div = document.createElement("div");

        div.className = "word-card";
        div.textContent = card.text;

        div.addEventListener("click", () => {
          clickCard(card, div);
        });

        cardGrid.appendChild(div);
      });
    }

    async function clickCard(card, cardElement) {
      if (!currentRoomCode || !currentPlayerId) return;

      const roomSnapshot = await get(ref(db, `rooms/${currentRoomCode}/status`));

      if (roomSnapshot.val() !== "playing") return;

      const point = card.type === "good" ? 1 : -1;

      await addScore(point);

      cardElement.style.pointerEvents = "none";

      if (point > 0) {
        playCorrectSound();
        cardElement.classList.add("correct");
        cardElement.textContent = "정답 +1";
      } else {
        playWrongSound();
        cardElement.classList.add("wrong");
        cardElement.textContent = "오답 -1";
      }
    }

    /* ===================== 기억력 카드 짝맞추기 ===================== */

    function startMemoryBoard(deck) {
      memoryState.deck = deck;
      memoryState.firstIndex = -1;
      memoryState.busy = false;
      memoryState.matchedCount = 0;

      memoryPairChip.textContent = "맞춘 짝 0";
      memoryBoardChip.textContent = memoryState.boardNumber + "번째 판";

      renderMemoryBoard(deck);
    }

    function renderMemoryBoard(deck) {
      memoryGrid.innerHTML = "";

      deck.forEach((card, index) => {
        const wrapper = document.createElement("div");
        wrapper.className = "mem-card";
        wrapper.dataset.index = String(index);

        const inner = document.createElement("div");
        inner.className = "mem-inner";

        const back = document.createElement("div");
        back.className = "mem-face mem-back";
        back.textContent = "💬";

        const front = document.createElement("div");
        front.className = "mem-face mem-front";
        front.textContent = card.text;

        inner.appendChild(back);
        inner.appendChild(front);
        wrapper.appendChild(inner);

        wrapper.addEventListener("click", () => {
          flipMemoryCard(index, wrapper);
        });

        memoryGrid.appendChild(wrapper);
      });
    }

    async function flipMemoryCard(index, element) {
      if (memoryState.busy) return;
      if (element.classList.contains("matched")) return;
      if (element.classList.contains("flipped")) return;

      element.classList.add("flipped");
      playFlipSound();

      if (memoryState.firstIndex === -1) {
        memoryState.firstIndex = index;
        return;
      }

      const firstIndex = memoryState.firstIndex;
      const firstElement = memoryGrid.querySelector(`.mem-card[data-index="${firstIndex}"]`);

      memoryState.firstIndex = -1;

      const isMatch =
        memoryState.deck[firstIndex].pairId === memoryState.deck[index].pairId;

      if (isMatch) {
        firstElement.classList.remove("flipped");
        element.classList.remove("flipped");
        firstElement.classList.add("matched");
        element.classList.add("matched");

        memoryState.matchedCount += 1;
        memoryPairChip.textContent = "맞춘 짝 " + memoryState.matchedCount;

        playCorrectSound();
        await addScore(1);

        if (memoryState.matchedCount * 2 === memoryState.deck.length) {
          await finishMemoryBoard();
        }

        return;
      }

      memoryState.busy = true;
      playWrongSound();

      setTimeout(() => {
        firstElement.classList.remove("flipped");
        element.classList.remove("flipped");
        memoryState.busy = false;
      }, 900);
    }

    async function finishMemoryBoard() {
      memoryState.busy = true;

      await addScore(MEMORY_BONUS_POINT);
      playClearSound();

      gameStatusMessage.textContent =
        "한 판 완성! 보너스 +" + MEMORY_BONUS_POINT + "점, 새 판이 시작됩니다.";

      setTimeout(() => {
        // 남은 시간 동안 계속 풀 수 있도록 같은 낱말로 새 판을 섞습니다.
        memoryState.boardNumber += 1;
        memoryState.localRound += 1;
        renderedMemoryKey = renderedMemoryKey + "#" + memoryState.localRound;

        const pairCount = memoryState.deck.length / 2;
        startMemoryBoard(makeMemoryDeck(pairCount));

        memoryState.busy = false;
      }, 1100);
    }

    /* ===================== 점수 / 소리 ===================== */

    async function addScore(point) {
      if (!currentRoomCode || !currentPlayerId) return;

      const scoreRef = ref(
        db,
        `rooms/${currentRoomCode}/players/${currentPlayerId}/score`
      );

      const snapshot = await get(scoreRef);
      const currentScore = snapshot.val() ?? 0;

      await set(scoreRef, currentScore + point);
    }

    function playCorrectSound() {
      playTone(740, 0.08, 0.05);

      setTimeout(() => {
        playTone(980, 0.12, 0.04);
      }, 90);
    }

    function playWrongSound() {
      playTone(260, 0.12, 0.06);

      setTimeout(() => {
        playTone(180, 0.16, 0.05);
      }, 110);
    }

    function playFlipSound() {
      playTone(520, 0.06, 0.03);
    }

    function playClearSound() {
      playTone(660, 0.09, 0.05);

      setTimeout(() => {
        playTone(880, 0.09, 0.05);
      }, 100);

      setTimeout(() => {
        playTone(1180, 0.16, 0.05);
      }, 200);
    }

    function playTone(frequency, duration, volume) {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;

      const audioContext = new AudioContext();
      const oscillator = audioContext.createOscillator();
      const gainNode = audioContext.createGain();

      oscillator.type = "sine";
      oscillator.frequency.value = frequency;

      gainNode.gain.setValueAtTime(volume, audioContext.currentTime);
      gainNode.gain.exponentialRampToValueAtTime(
        0.001,
        audioContext.currentTime + duration
      );

      oscillator.connect(gainNode);
      gainNode.connect(audioContext.destination);

      oscillator.start();
      oscillator.stop(audioContext.currentTime + duration);
    }

    function escapeHtml(text) {
      return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    applyTeacherOptionView();
  </script>
